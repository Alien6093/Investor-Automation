name: Events Fetcher (3x daily, random times)

on:
  schedule:
    # Wakes every 15 min from 08:30 to 19:15 IST (03:00-13:45 UTC). fetch_events.py only
    # collects at today's 3 random times (9 AM-7 PM IST, 2-3 hours apart).
    - cron: '*/15 3-13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what would be added, do not write to the sheet'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # keep-alive below

concurrency:
  group: events-fetch
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Events Fetcher
        env:
          PYTHONUNBUFFERED: '1'
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # A manual run collects right away
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python fetch_events.py

      # GitHub pauses scheduled workflows after 60 days without repository activity
      - name: Keep schedules enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable events_fetch.yml --repo "$GITHUB_REPOSITORY" || true
          gh workflow enable daily_vc_fetch.yml --repo "$GITHUB_REPOSITORY" || true
